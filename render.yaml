# Render "Blueprint": deploys the whole app as ONE free web service.
# Express serves the API under /api and the built React app for every other URL,
# so the login cookie works without any cross-site setup.
#
# Render dashboard → New → Blueprint → pick this repository.
# You will be asked for the values marked `sync: false`.
services:
  - type: web
    name: ambulance-service
    runtime: node
    plan: free
    region: singapore
    # Server: production dependencies only (skips the test-only MongoDB download).
    # Client: needs its dev dependencies (Vite) to build.
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAMESITE
        value: lax
      - key: DEFAULT_ETA_MINUTES
        value: "15"
      # Long random secret, generated by Render once.
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string (mongodb+srv://...)
      - key: MONGODB_URI
        sync: false
      # Secret code needed to register as Admin on the website (leave empty to disable)
      - key: ADMIN_REGISTRATION_CODE
        sync: false
